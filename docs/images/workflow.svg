<g><rect x="476" y="35" width="186" height="120" rx="12" fill="#fff" stroke="#cfdcd8"/><circle cx="569" cy="35" r="17" fill="#12303f"/><text x="569" y="41" font-size="17" font-weight="700" fill="#fff">3</text><text x="569" y="85" font-size="18" font-weight="700">Integrate</text><text x="569" y="110" font-size="14" fill="#4f6670">Direct Merge, Clip + Snap</text><text x="569" y="130" font-size="14" fill="#4f6670">or Targeted Snap</text></g>
<g><rect x="702" y="35" width="174" height="120" rx="12" fill="#fff" stroke="#cfdcd8"/><circle cx="789" cy="35" r="17" fill="#12303f"/><text x="789" y="41" font-size="17" font-weight="700" fill="#fff">4</text><text x="789" y="85" font-size="18" font-weight="700">Export and log</text><text x="789" y="110" font-size="14" fill="#4f6670">GPKG, SHP or GDB</text><text x="789" y="130" font-size="14" fill="#4f6670">plus a run log</text></g>
</g>
