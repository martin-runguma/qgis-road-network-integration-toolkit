<rect width="900" height="190" rx="16" fill="#eef3f1"/>
<g font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" fill="#12303f">
<g><rect x="24" y="35" width="186" height="120" rx="12" fill="#fff" stroke="#cfdcd8"/><circle cx="117" cy="35" r="17" fill="#12303f"/><text x="117" y="41" font-size="17" font-weight="700" fill="#fff">1</text><text x="117" y="85" font-size="18" font-weight="700">Prepare inputs</text><text x="117" y="110" font-size="14" fill="#4f6670">Reproject, repair,</text><text x="117" y="130" font-size="14" fill="#4f6670">clip to study area</text></g>
