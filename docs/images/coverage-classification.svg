<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Dominant single-buffer coverage classification</title>
  <desc id="desc">A secondary road intersects an individual buffer around a priority road. The largest single-buffer overlap is compared with original road length. More than 75 percent coverage is suppressed, while exactly 75 percent is left unclassified.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #0B2545; }
      .sub { fill: #526575; font-size: 14px; }
      .road { fill: none; stroke: #0B5E8E; stroke-width: 10; stroke-linecap: round; }
      .secondary { fill: none; stroke: #12B8A6; stroke-width: 8; stroke-linecap: round; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1499D6"/></marker>
  </defs>
  <rect width="1100" height="390" rx="20" fill="#F4F7F9"/>
  <text x="36" y="44" font-size="22" font-weight="700">Coverage is measured against the largest individual buffer overlap</text>
  <rect x="36" y="72" width="496" height="270" rx="15" fill="#ffffff" stroke="#D7E2E8" stroke-width="2"/>
  <text x="58" y="107" font-size="16" font-weight="700">Conceptual plan view</text>
  <circle cx="268" cy="222" r="106" fill="#1499D6" fill-opacity=".10" stroke="#1499D6" stroke-width="2" stroke-dasharray="8 6"/>
  <path class="road" d="M90 222H444"/>
  <path class="secondary" d="M103 164H416"/>
  <path d="M124 164H365" fill="none" stroke="#D84A64" stroke-width="8" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#0B2545" stroke-width="2"><circle cx="90" cy="222" r="5"/><circle cx="444" cy="222" r="5"/></g>
  <text x="267" y="251" text-anchor="middle" class="sub">priority road + its individual buffer</text>
  <text x="260" y="145" text-anchor="middle" class="sub">secondary road · overlap segment highlighted</text>
  <text x="284" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#B4334E">Largest overlap / original length</text>
  <path d="M535 205H585" fill="none" stroke="#1499D6" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="610" y="88" width="452" height="107" rx="14" fill="#ffffff" stroke="#D7E2E8" stroke-width="2"/>
  <text x="636" y="123" font-size="16" font-weight="700">If coverage is greater than 75%</text>
  <text x="636" y="151" class="sub">Class `missing_a` or `missing_b`; excluded from merged outputs.</text>
  <rect x="610" y="217" width="452" height="107" rx="14" fill="#ffffff" stroke="#D7E2E8" stroke-width="2"/>
  <text x="636" y="252" font-size="16" font-weight="700">If coverage is exactly 75%</text>
  <text x="636" y="280" class="sub">Remaining ratio is 0.25; the legacy classifier leaves it unclassified.</text>
  <text x="550" y="370" text-anchor="middle" class="sub">Conceptual illustration only · overlaps from separate buffers are not summed.</text>
</svg>
