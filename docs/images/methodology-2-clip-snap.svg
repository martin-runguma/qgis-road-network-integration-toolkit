<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 390" role="img" aria-labelledby="title desc">
  <title id="title">Methodology 2: Clip + Snap</title>
  <desc id="desc">Eligible secondary roads are differenced against the dissolved priority-buffer mask. The covered line portions are removed, and the remaining line-part endpoints are snapped to regularly spaced priority-road anchors within the maximum snapping distance.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #0B2545; }
      .card { fill: #ffffff; stroke: #D7E2E8; stroke-width: 2; }
      .base { fill: none; stroke: #0B5E8E; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .sec { fill: none; stroke: #12B8A6; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .muted { fill: #526575; font-size: 13px; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1499D6"/></marker>
  </defs>
  <rect width="1140" height="390" rx="18" fill="#F4F7F9"/>
  <text x="32" y="42" font-size="22" font-weight="700">Methodology 2 · Clip + Snap</text>
  <g>
    <rect class="card" x="28" y="68" width="340" height="264" rx="14"/>
    <rect class="card" x="400" y="68" width="340" height="264" rx="14"/>
    <rect class="card" x="772" y="68" width="340" height="264" rx="14"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="700">
    <text x="198" y="99">1 · Overlap with mask</text><text x="570" y="99">2 · Difference / trim</text><text x="942" y="99">3 · Snap and merge</text>
  </g>
  <path d="M374 194H392M746 194H764" stroke="#1499D6" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Stage 1: secondary line crosses a dissolved buffer surrounding priority roads. -->
  <path d="M57 190C116 153 174 220 236 182S315 169 340 192" fill="none" stroke="#1499D6" stroke-width="52" stroke-opacity=".12" stroke-linecap="round"/>
  <path class="base" d="M57 190C116 153 174 220 236 182S315 169 340 192"/>
  <path class="sec" d="M55 270L106 245L157 221"/>
  <path d="M157 221L207 194L255 179" fill="none" stroke="#D84A64" stroke-width="7" stroke-linecap="round"/>
  <path class="sec" d="M255 179L306 149L344 132"/>
  <text x="198" y="300" text-anchor="middle" class="muted">Dissolved mask around priority roads</text>
  <!-- Stage 2: the red, covered segment has been removed. -->
  <path d="M429 190C488 153 546 220 608 182S687 169 712 192" fill="none" stroke="#1499D6" stroke-width="52" stroke-opacity=".12" stroke-linecap="round"/>
  <path class="base" d="M429 190C488 153 546 220 608 182S687 169 712 192"/>
  <path class="sec" d="M427 270L478 245L529 221"/>
  <path class="sec" d="M627 179L678 149L716 132"/>
  <path d="M529 221L572 198M627 179L605 188" fill="none" stroke="#D84A64" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="570" y="300" text-anchor="middle" class="muted">Covered line portions are removed</text>
  <!-- Stage 3: one retained part endpoint is moved to a spaced anchor. -->
  <path class="base" d="M801 190L847 176L891 183L938 158L992 169L1069 142"/>
  <g fill="#ffffff" stroke="#0B5E8E" stroke-width="2"><circle cx="801" cy="190" r="5"/><circle cx="847" cy="176" r="5"/><circle cx="891" cy="183" r="5"/><circle cx="938" cy="158" r="5"/><circle cx="992" cy="169" r="5"/><circle cx="1069" cy="142" r="5"/></g>
  <path class="sec" d="M806 270L840 245L871 222L891 183"/>
  <circle cx="871" cy="222" r="5" fill="none" stroke="#D84A64" stroke-width="2"/>
  <circle cx="891" cy="183" r="8" fill="#1499D6" stroke="#ffffff" stroke-width="2"/>
  <text x="942" y="300" text-anchor="middle" class="muted">Endpoints move to nearby spaced anchors</text>
  <text x="570" y="363" text-anchor="middle" class="muted">Anchor interval and maximum snapping distance are configurable · diagram is schematic</text>
</svg>
